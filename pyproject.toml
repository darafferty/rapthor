[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=64",
    "setuptools_scm[toml]>=6.2",
    "wheel",
]

[project]
name = "rapthor"
authors = [
    {name = "David Rafferty", email = "drafferty@hs.uni-hamburg.de"},
    {name = "Marcel Loose", email = "loose@astron.nl"},
    {name = "Andre Offringa", email = "offringa@astron.nl"},
    {name = "Arend G. Dijkstra", email = "adijkstra@astron.nl"},
    {name = "Tammo Jan Dijkema", email = "dijkema@astron.nl"},
    {name = "Mark de Wever", email = "mark.dewever@stcorp.nl"},
    {name = "Frits Sweijen", email = "sweijen@astron.nl"},
    {name = "Sarod Yatawatta", email = "yatawatta@astron.nl"},
]
description = "Rapthor: LOFAR DDE Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "bdsf",
    "bokeh>=3.1.0",
    "dask[distributed]",
    "fastapi<0.137",
    "h5py",
    "losoto>=2.4.3",
    "lsmtool>=1.9.0",
    "matplotlib",
    "mocpy",
    "numpy",
    "prefect[dask,shell]>=3.4.11,<4.0.0",
    "prefect-dask",
    "prefect-shell",
    "psutil",
    "python-casacore",
    "python-dateutil",
    "reproject",
    "requests",
    "Rtree",
    "scipy",
    "shapely",
]
dynamic = ["version"]

[project.scripts]
rapthor = "rapthor.cli:main"
concat_linc_files = "rapthor.execution.concatenate.linc_cli:main"

[project.optional-dependencies]
test = [
    "tox",
]
docs = [
    "numpydoc",
    "snowballstemmer!=3.0.0",
    "sphinx",
    "sphinxcontrib-mermaid",
]
dev =  ["ruff", "rapthor[test]", "rapthor[docs]" ]

[dependency-groups]
test =  [
    "tox",
    "mock",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
    "pytest-socket",
]
docs = [
    "numpydoc",
    "snowballstemmer!=3.0.0",
    "sphinx",
    "sphinxcontrib-mermaid",
]
dev =  [
    "numpydoc",
    "ruff",
    "snowballstemmer!=3.0.0",
    "sphinx",
    "sphinxcontrib-mermaid",
    "tox",
    "mock",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
    "pytest-socket",
]


[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks test as integration tests",
    "internet: marks tests that require internet access",
    "prefect: marks tests that start or share a Prefect test server",
    "serial: marks tests that start their own Prefect and Dask processes and must run outside the parallel pool"
]


[tool.setuptools]
# package-data is specified below in section [tool.setuptools.package-data]
include-package-data = false

[tool.setuptools.packages.find]
include = ["rapthor*"]

[tool.setuptools.package-data]
rapthor = [
    "settings/*",
    "skymodels/*"
]


[tool.setuptools_scm]
write_to = "rapthor/_version.py"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Expand basic rules with name and style checks roughly equivalent to flake8 + black + pylint
# Some additional functional errors such as `await` on none async or wrong return types / args.
# More info https://docs.astral.sh/ruff/rules/
# TODO: Slowly add more rules and fix issues. E.g., start with "E" and "F"; then add "B",
# and so on. The `select` below is from our ASTRON Python project template.
# select = ["N", "A", "E", "F", "B", "W", "Q", "PL", "ASYNC", "S", "G", "RET", "ARG", "I"]
# The default behavior of ruff is to use "E" and "F", omitting stylistic rules.
select = ["E", "F"]  # pycodestyle and pyflakes
ignore = ["E501"]  # line-too-long

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused-import
"tests/**" = [
    "F401",  # unused-import
    "F403",  # undefined-local-with-import-star
    "F405",  # undefined-local-with-import-star-usage
    "F841",  # unused-variable
]


[tool.coverage.run]
# Follow the `rapthor` subprocesses and Dask workers that the tests start.
# `subprocess` starts coverage in every Python child and implies one data file
# per process; `_exit` saves the data of multiprocessing children, which leave
# through os._exit. Dask nannies stop their workers with SIGTERM.
patch = ["subprocess", "_exit"]
sigterm = true
# setuptools_scm writes this file into the build only; the coverage_report job
# runs on a plain checkout, where it does not exist.
omit = ["*/rapthor/_version.py"]

[tool.coverage.report]
# Also drop it from data that was measured before the run omit applied.
omit = ["*/rapthor/_version.py"]

[tool.coverage.paths]
# tox measures the package it installs into its environment. Map it back onto
# the checkout so data from the test lanes combine and report in another job.
source = ["rapthor/", "*/site-packages/rapthor/"]

[tool.tox]
requires = ["tox>4"]
envlist = ["lint", "format", "py3{9,10,11,12,13}", "test_integration"]

[tool.tox.env_run_base]
description = "Run all tests"
deps = [
    "tox",
    "mock",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
    "pytest-socket",
]
# Keep EveryBeam's data path when tox changes VIRTUAL_ENV, and allow local
# control of test output directories and xdist's automatic worker count.
pass_env = [
    "EVERYBEAM_DATADIR",
    "RAPTHOR_TEST_RUN_ROOT",
    "PYTEST_XDIST_AUTO_NUM_WORKERS",
]
commands = [
    # Isolate process-startup smoke tests from parallel workers' CPU load.
    [
        "python", "-m", "pytest",
        "-m", "not integration and serial",
        "--cov=rapthor",
        "tests/{posargs}",
    ],
    # Other flow tests share one Prefect server per worker.
    [
        "python", "-m", "pytest",
        "-m", "not integration and not serial",
        "-n", "auto",
        "--dist", "worksteal",
        "--cov=rapthor",
        "--cov-append",
        "--cov-report", "term-missing",
        "--cov-report", "xml",
        "--cov-report", "html",
        "tests/{posargs}",
    ],
]

[tool.tox.env_run_base.set_env]
# Use the faster coverage core on Python 3.12+; older Pythons fall back.
COVERAGE_CORE = "sysmon"
# Give every measured process the same absolute data file; CI sets one name
# per lane and node so the coverage_report job can combine them.
COVERAGE_FILE = "{env:COVERAGE_FILE:{toxinidir}/.coverage}"

[tool.tox.env.test_integration]
description = "Run integration tests"
deps = [
    { replace = "ref", of = ["dependency-groups", "test"], extend = true },
    "pytest-split<0.11",
]
pass_env = [
    "CI_PROJECT_DIR",
    "CI_NODE_INDEX",
    "CI_NODE_TOTAL",
    "EVERYBEAM_DATADIR",  # see env_run_base
    "BLIS_NUM_THREADS",
    "MKL_NUM_THREADS",
    "NUMEXPR_MAX_THREADS",
    "OMP_NUM_THREADS",
    "OPENBLAS_NUM_THREADS",
    "VECLIB_MAXIMUM_THREADS",
    "PREFECT_HOME",
    "RAPTHOR_TEST_RUN_ROOT",
]
commands = [
    [
        "python", "-m", "pytest",
        "-m", "integration",
        "-vv", "-ra",
        "--durations=0",
        "--splits", "{env:CI_NODE_TOTAL:1}",
        "--group", "{env:CI_NODE_INDEX:1}",
        # Balance CI nodes by stored timings, assigning longest tests first.
        "--splitting-algorithm", "least_duration",
        "--durations-path", "{toxinidir}/.test_durations",
        # Collect coverage for the combined CI report; a report of one node's
        # share of the tests alone would be misleading, so print none here.
        "--cov=rapthor",
        "--cov-report=",
        "tests/integration",
        "tests/operations/integration",
        "tests/execution/integration",
    ]
]

[tool.tox.env.lint]
skip_install = true
deps = "ruff==0.15.20"
# Keep the command targets explicit instead of using tox TOML ref inline tables
# because Prefect reads pyproject.toml at import time on Python 3.10 with a
# TOML parser that cannot handle those nested inline tables.
commands = [
    [
        # check all files for selected rules (configured in [tool.ruff.lint])
        "python", "-m", "ruff", "check",
    ],
    [
        # Check imports are sorted in all discovered Python files.
        "python", "-m", "ruff", "check", "--select", "I"
    ],
    [
        # Check formatting in all discovered Python files.
        "python", "-m", "ruff", "format", "--check", "-v"
    ]
]

[tool.tox.env.format]
skip_install = true
deps = "ruff==0.15.20"
commands = [
    [
        # sort imports in all discovered Python files
        "python", "-m", "ruff", "check", "--select", "I", "--fix"
    ],
    [
        # format all discovered Python files
        "python", "-m", "ruff", "format"
    ],

]
